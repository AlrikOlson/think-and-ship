# Weekly, grouped: each ecosystem opens at most one non-security PR per week,
# because every PR spends the CI budget (three-OS Rust matrix + four npm jobs).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
      - /infra
      - /site
      - /crates/think-and-ship-viewer
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
