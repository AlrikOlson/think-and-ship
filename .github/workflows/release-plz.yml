name: release-plz

# release-plz drives versioning + changelog + crates.io publish + git tag from
# Conventional Commits. See release-plz.toml and docs/RELEASING.md.
#
# Flow:
#   1. release-plz-pr keeps an open "Release v0.x.y" PR up to date with the
#      version bump + CHANGELOG.md entries derived from commits on main.
#   2. When that PR is merged, release-plz-release publishes `think-and-ship`
#      to crates.io and pushes a `v0.x.y` tag + GitHub release.
#   3. That tag triggers .github/workflows/release.yml (binaries + npm).
#
# The tag in step 2 only triggers step 3 if release-plz authenticates with a
# PAT / GitHub App token (secrets.RELEASE_PLZ_TOKEN). The default GITHUB_TOKEN
# cannot trigger downstream workflows — GitHub's anti-recursion rule.
#
# This used to fall back to GITHUB_TOKEN when RELEASE_PLZ_TOKEN was unset. The
# fallback is what broke the pipeline: crates.io got 0.2.0 and 0.3.0 while npm
# stayed on 0.1.1, because release-plz published and tagged, release.yml never
# fired, and nothing failed. A half-release that reports success is worse than
# no release, so the preflight below now STOPS instead of degrading.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never run two release-plz invocations against the same branch concurrently.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishes + tags once a release PR is merged into main.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fail BEFORE publishing anything. crates.io publishes are permanent, so
      # discovering the token is missing after the publish leaves a version
      # that can never be un-shipped and an npm package that never catches up.
      - name: Require a token that can trigger release.yml
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLZ_TOKEN}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set."
            echo "release-plz would publish to crates.io and push a tag using GITHUB_TOKEN,"
            echo "which cannot trigger release.yml — no binaries, no npm publish, and no"
            echo "failure anywhere. That is exactly how npm fell to 0.1.1 behind crates.io."
            echo "Create a PAT with contents:write (docs/deploy/setup-release-plz-token.sh)"
            echo "and add it as the RELEASE_PLZ_TOKEN repository secret."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Digest-pinned; dtolnay/rust-toolchain needs an explicit `toolchain:`
      # once the ref no longer names one.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Keeps the version-bump / changelog PR up to date on every push to main.
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A release PR opened by GITHUB_TOKEN gets no CI runs, so the required
      # checks never report and the ruleset can never let it merge. Stop here
      # and say why, rather than opening a PR that is unmergeable by design.
      - name: Require a token whose PRs can run CI
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLZ_TOKEN}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set."
            echo "A release PR opened with GITHUB_TOKEN never triggers CI, so the required"
            echo "checks stay pending and the PR cannot merge. Create a PAT with"
            echo "contents:write + pull-requests:write (docs/deploy/setup-release-plz-token.sh)"
            echo "and add it as the RELEASE_PLZ_TOKEN repository secret."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Digest-pinned; dtolnay/rust-toolchain needs an explicit `toolchain:`
      # once the ref no longer names one.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
