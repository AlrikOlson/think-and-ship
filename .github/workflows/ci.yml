name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Dependabot PRs do not run CI on their own — every job is gated on the
# actor, so the three-OS matrix only spends Actions minutes when a human
# asks. To run checks on a dependabot PR: close and reopen it (the reopen
# event carries your actor), or run this workflow via workflow_dispatch
# against the PR branch. `@dependabot rebase` stays skipped (dependabot
# is the actor). The skipped checks read as "skipped", never green — a
# dependabot PR cannot look validated without a run you triggered.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Full debuginfo across ~40 test binaries fills the 14 GB runner disk, and
  # lld dies with SIGBUS when its mmapped output has no pages left to back
  # it. Line tables keep panic backtraces readable at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  # The crate and the npm wrapper ship the same binary under the same version,
  # but release-plz only bumps Cargo.toml. Nothing bumped package.json, and the
  # two silently drifted until npm served 0.1.1 against crates.io 0.3.0, and
  # v0.5.0 and v0.5.1 each needed a hand-made bump. For releases after 0.5.1
  # the release-plz job syncs package.json on the release PR itself
  # (scripts/release/sync-release-pr.py); this is the in-repo guard that stays
  # red if that ever regresses, and registry-parity.yml watches what is
  # actually published.
  # Classifies the diff so a change that does not touch Rust does not build
  # Rust. The Rust jobs below are job-level conditionals on this output — a
  # required check that is SKIPPED counts as passing, whereas a workflow-level
  # `paths:` filter would leave it "expected" forever and block the merge.
  # Anything not in the allowlist of Rust-free paths counts as Rust, so a new
  # kind of file errs on the side of running the gate.
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ]; then base="${PR_BASE}"; else base="${PUSH_BEFORE}"; fi
          rust=false
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] \
             || ! files=$(git diff --name-only "${base}" "${HEAD}" 2>/dev/null); then
            echo "no usable base to diff against — treating the change as Rust"
            rust=true
          else
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              case "${f}" in
                .github/workflows/ci.yml) rust=true ;;   # this file's own changes get the full gate
                crates/think-and-ship-viewer/src-tauri/*) rust=true ;;
                *.md|docs/*|scripts/*|npm/*|site/*|frontend/*|backend/*|infra/*|windsurf/*|shared/*|\
                .github/*|crates/think-and-ship-viewer/*|*.png|LICENSE|.gitignore|.gitattributes) ;;
                *) rust=true ;;
              esac
            done <<< "${files}"
            echo "changed files:"; printf '  %s\n' ${files}
          fi
          echo "rust=${rust}" | tee -a "$GITHUB_OUTPUT"

  versions:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo.toml and package.json agree
        run: |
          set -euo pipefail
          cargo_v=$(sed -n '/^\[package\]/,/^\[/p' crates/think-and-ship/Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          npm_v=$(node -p "require('./npm/think-and-ship/package.json').version")
          echo "Cargo.toml:   $cargo_v"
          echo "package.json: $npm_v"
          if [ -z "$cargo_v" ]; then
            echo "::error::could not read the version from crates/think-and-ship/Cargo.toml"
            exit 1
          fi
          if [ "$cargo_v" != "$npm_v" ]; then
            echo "::error::version drift — Cargo.toml is $cargo_v but npm/think-and-ship/package.json is $npm_v."
            echo "They ship the same binary and must release together. Update package.json."
            exit 1
          fi

  fmt:
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # dtolnay/rust-toolchain reads the toolchain from the ref when unpinned;
      # once digest-pinned, `toolchain:` must be passed explicitly.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy on the two OSes that gate a merge. Windows never runs here: it is
  # dispatch-only (windows-ci.yml), so it cannot spend minutes or stall a PR.
  clippy:
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --workspace --all-targets --exclude think-and-ship-viewer -- -D warnings

  test:
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --workspace --all-targets --exclude think-and-ship-viewer

  # Everything here ships to docs.rs — a broken intra-doc link or a public
  # doc linking a private item is a rendered defect, not a style nit.
  docs:
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo doc --no-deps --workspace --exclude think-and-ship-viewer

  # Every crate that DECLARES a rust-version builds with that toolchain.
  # `check` not `test`: the claim being verified is "compiles at the MSRV".
  # RUSTFLAGS is cleared — an older compiler may warn where stable does not,
  # and a warning is not an MSRV violation.
  msrv:
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.89
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo +1.89 check -p think-and-ship --locked
